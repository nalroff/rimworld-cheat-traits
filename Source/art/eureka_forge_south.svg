    <rect x="48" y="48" width="72" height="16" fill="#1a3a1e"/>
    <rect x="48" y="54" width="72" height="2" fill="#284a30"/>
    <rect x="48" y="49" width="72" height="1" fill="#284a30"/>
    <rect x="48" y="62" width="72" height="1" fill="#0a1a0c"/>
    <rect x="116" y="51" width="4" height="11" fill="#d6cea0"/>
