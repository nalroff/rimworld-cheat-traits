    <rect x="352" y="64" width="18" height="44" fill="#1a3a1e"/>
    <rect x="352" y="70" width="18" height="2" fill="#284a30"/>
    <rect x="352" y="100" width="18" height="2" fill="#284a30"/>
    <rect x="352" y="65" width="18" height="1" fill="#4a7050"/>
    <rect x="352" y="107" width="18" height="1" fill="#0a1a0c"/>
    <rect x="354" y="62" width="14" height="2" fill="#d6cea0"/>
    <rect x="354" y="62" width="14" height="1" fill="#f0e8c8"/>
    <circle cx="361" cy="85" r="4" fill="none" stroke="#c89030" stroke-width="0.8"/>
