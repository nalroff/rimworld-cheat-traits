    <rect x="382" y="107" width="32" height="6" fill="#3a2818"/>
    <rect x="384" y="107" width="28" height="1" fill="#5c3e22"/>
    <rect x="386" y="108" width="4" height="1" fill="#8a5a30"/>
    <rect x="383" y="100" width="3" height="6" fill="#1a1410"/>
    <rect x="410" y="100" width="3" height="6" fill="#1a1410"/>
    <rect x="396" y="98" width="3" height="6" fill="#1a1410"/>
    <!-- Orb halo -->
