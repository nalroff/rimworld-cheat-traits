    <circle cx="398" cy="82" r="16" fill="#a8fff5" opacity="0.35" filter="url(#softGlow)"/>
    <!-- Orb body -->
    <circle cx="398" cy="82" r="16" fill="#1a3a3a"/>
    <circle cx="398" cy="82" r="14" fill="#2a6a6a"/>
    <circle cx="398" cy="82" r="11" fill="#4dffea"/>
    <circle cx="398" cy="82" r="6" fill="#a8fff5"/>
    <ellipse cx="392" cy="76" rx="4" ry="3" fill="#ffffff"/>
