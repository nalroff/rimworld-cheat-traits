    <polygon points="156,87 232,86 232,88 158,89" fill="#ffffff"/>
    <polygon points="158,109 232,108 232,106 160,107" fill="#d6cea0"/>
    <polygon points="156,87 158,109 160,107 158,89" fill="#b8aa78"/>

