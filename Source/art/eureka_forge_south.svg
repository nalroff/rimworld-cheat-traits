    <rect x="238" y="18" width="2" height="2" fill="#a8fff5" transform="rotate(45 239 19)"/>
    <rect x="224" y="32" width="2" height="2" fill="#a8fff5" transform="rotate(45 225 33)"/>
    <rect x="238" y="32" width="2" height="2" fill="#a8fff5" transform="rotate(45 239 33)"/>
