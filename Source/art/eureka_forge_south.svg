      <rect x="149" y="128" width="2" height="20" fill="#404048"/>
      <rect x="149" y="130" width="1" height="2" fill="#6a6a78"/>

      <rect x="294" y="128" width="5" height="20" fill="#1a1410"/>
      <rect x="295" y="128" width="2" height="20" fill="#404048"/>
      <rect x="295" y="130" width="1" height="2" fill="#6a6a78"/>
