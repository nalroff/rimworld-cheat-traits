    <rect x="160" y="96" width="2" height="1" fill="#8a5a30" opacity="0.7"/>
    <rect x="280" y="76" width="2" height="1" fill="#8a5a30" opacity="0.7"/>
    <rect x="200" y="118" width="2" height="1" fill="#8a5a30" opacity="0.65"/>
    <rect x="340" y="116" width="2" height="1" fill="#8a5a30" opacity="0.65"/>
    <rect x="100" y="120" width="2" height="1" fill="#8a5a30" opacity="0.6"/>
