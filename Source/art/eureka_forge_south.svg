    <rect x="36" y="84" width="90" height="24" rx="1" fill="#1a0e08"/>
    <rect x="38" y="86" width="86" height="20" fill="#5a1a14"/>
    <rect x="38" y="94" width="86" height="2" fill="#8a2820"/>
    <rect x="38" y="87" width="86" height="1" fill="#8a2820"/>
    <rect x="38" y="105" width="86" height="1" fill="#3a0e08"/>
    <rect x="122" y="89" width="4" height="16" fill="#d6cea0"/>
