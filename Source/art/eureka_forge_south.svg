<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="448" height="192" viewBox="0 0 448 192" shape-rendering="auto">
  <defs>
    <clipPath id="tableTopClip">
      <polygon points="40,36 408,36 432,128 16,128"/>
    </clipPath>
    <clipPath id="tableFrontClip">
      <rect x="16" y="128" width="416" height="20"/>
    </clipPath>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
