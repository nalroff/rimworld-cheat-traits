  <!-- ============ AMBIENT CYAN AURA ============ -->
  <ellipse cx="232" cy="30" rx="120" ry="32" fill="#4dffea" opacity="0.18" filter="url(#bigGlow)"/>
  <ellipse cx="386" cy="62" rx="40" ry="32" fill="#a8fff5" opacity="0.28" filter="url(#softGlow)"/>

  <!-- ============ TABLE LEGS ============ -->
  <g>
    <rect x="18" y="148" width="20" height="34" rx="2" fill="#1a1410"/>
    <rect x="20" y="150" width="14" height="30" fill="#3a2818"/>
    <rect x="30" y="150" width="4" height="30" fill="#1a0e08"/>
    <rect x="21" y="152" width="3" height="2" fill="#5c3e22"/>

    <rect x="410" y="148" width="20" height="34" rx="2" fill="#1a1410"/>
    <rect x="412" y="150" width="14" height="30" fill="#3a2818"/>
    <rect x="422" y="150" width="4" height="30" fill="#1a0e08"/>
    <rect x="413" y="152" width="3" height="2" fill="#5c3e22"/>
