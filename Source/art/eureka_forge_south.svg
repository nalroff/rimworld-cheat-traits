    <line x1="32" y1="84" x2="434" y2="84" stroke="#3a2818" stroke-width="1" opacity="0.5"/>
    <line x1="24" y1="106" x2="432" y2="106" stroke="#3a2818" stroke-width="1" opacity="0.45"/>
