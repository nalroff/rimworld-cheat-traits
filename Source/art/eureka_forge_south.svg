    <rect x="312" y="94" width="20" height="18" rx="1" fill="#1a1410"/>
    <rect x="314" y="96" width="16" height="15" fill="#26262e"/>
    <rect x="315" y="96" width="2" height="13" fill="#3a3a48"/>
    <rect x="328" y="96" width="2" height="13" fill="#15151a"/>
    <ellipse cx="322" cy="94" rx="10" ry="3" fill="#1a1410"/>
