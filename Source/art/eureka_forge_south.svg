    <path d="M 346,50 L 354,38 L 348,40 L 352,34 L 344,38 L 342,32 L 340,38 L 344,44 L 340,46 L 342,48 Z" fill="#f0e8c8"/>
    <path d="M 346,50 L 352,36 L 348,38 L 346,44 L 344,44 Z" fill="#d6cea0"/>
    <line x1="342" y1="48" x2="350" y2="38" stroke="#b8aa78" stroke-width="0.5"/>

