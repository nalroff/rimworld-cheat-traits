  <ellipse cx="232" cy="26" rx="22" ry="14" fill="#a8fff5" opacity="0.40" filter="url(#softGlow)"/>
  <ellipse cx="232" cy="56" rx="22" ry="12" fill="#4dffea" opacity="0.20" filter="url(#softGlow)"/>

