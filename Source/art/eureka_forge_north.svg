  <!-- ============ AMBIENT CYAN AURA (subdued — back side) ============ -->
  <ellipse cx="232" cy="30" rx="110" ry="28" fill="#4dffea" opacity="0.14" filter="url(#bigGlow)"/>
  <ellipse cx="60" cy="62" rx="36" ry="28" fill="#a8fff5" opacity="0.25" filter="url(#softGlow)"/>

  <!-- ============ TABLE LEGS ============ -->
