    <rect x="328" y="69" width="4" height="13" fill="#d6cea0"/>
    <rect x="328" y="70" width="4" height="1" fill="#f0e8c8"/>

    <rect x="334" y="46" width="76" height="20" rx="1" fill="#1a0e08"/>
    <rect x="336" y="48" width="72" height="16" fill="#1a3a1e"/>
    <rect x="336" y="54" width="72" height="2" fill="#284a30"/>
    <rect x="336" y="49" width="72" height="1" fill="#284a30"/>
    <rect x="336" y="62" width="72" height="1" fill="#0a1a0c"/>
    <rect x="336" y="51" width="4" height="11" fill="#d6cea0"/>
    <rect x="336" y="52" width="4" height="1" fill="#f0e8c8"/>
